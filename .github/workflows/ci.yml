name: DeployIQ CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sample-app/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m unittest discover -s evaluation/tests -v
      - run: python infrastructure/scripts/build_monitoring_template.py --check
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  docker-build:
    permissions:
      contents: read
      id-token: write
    needs: [test, backend-test, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t deployiq-sample:ci ./sample-app
      - name: Check running container
        shell: bash
        run: |
          docker run -d --name deployiq-sample -p 127.0.0.1:8000:8000 deployiq-sample:ci
          trap 'docker logs deployiq-sample; docker rm -f deployiq-sample' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Authenticate to AWS with GitHub OIDC
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::732529884848:role/DeployIQGitHubECRRole
          aws-region: us-east-1
          allowed-account-ids: '732529884848'
      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/amazon-ecr-login@v2
      - name: Upload tested image to ECR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ECR_REPOSITORY: 732529884848.dkr.ecr.us-east-1.amazonaws.com/deployiqsample
        run: |
          IMAGE_URI="$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag deployiq-sample:ci "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "Uploaded image: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy release to EC2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          EC2_INSTANCE_ID: i-0433f54131bf4562e
          IMAGE_URI: 732529884848.dkr.ecr.us-east-1.amazonaws.com/deployiqsample:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 infrastructure/scripts/deploy_ssm.py
